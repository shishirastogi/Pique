name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd apps/client
          npm ci

      - name: Build Web Client
        run: |
          cd apps/client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd apps/client
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x apps/client/android/gradlew

      - name: Build Debug APK
        run: |
          cd apps/client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Clarity
        run: |
          mkdir -p build-output
          cp apps/client/android/app/build/outputs/apk/debug/app-debug.apk build-output/Pique-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pique-debug-apk
          path: build-output/Pique-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: "Pique Android APK (Latest)"
          body: |
            ### Pique Android Application (Debug Build)
            - **Backend Connected**: `https://pique-api-175706581364.asia-south1.run.app`
            - **Commit**: `${{ github.sha }}`
            - Download `Pique-debug.apk` directly to your Android device to install.
          files: build-output/Pique-debug.apk
        continue-on-error: true
