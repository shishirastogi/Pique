# FocusWarmup service dependencies (docs/02 §9, 06 §1).
# Slice default runs WITHOUT this (sqlite file). When you're ready for the
# real database + pgvector + redis-backed pipeline:  docker compose -f infra/docker-compose.yml up -d
# then point the API at it:  PIQUE_DATABASE_URL=postgresql+psycopg://pique:pique@localhost:5432/pique
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pique
      POSTGRES_PASSWORD: pique
      POSTGRES_DB: pique
    ports: ["5432:5432"]
    volumes: ["pique-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pique"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["pique-redis:/data"]
    # ready for: lock TTLs, rank cache, ARQ job queue (11 pipeline formal)

volumes:
  pique-pg:
  pique-redis:
